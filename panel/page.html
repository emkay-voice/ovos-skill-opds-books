<style>
  .cat-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; }
  .cat-list li { display: grid; gap: 0.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .cat-list li:last-child { border-bottom: 0; padding-bottom: 0; }
  .cat-fields { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
  .cat-fields .wide { grid-column: 1 / -1; }
  .cat-state { color: var(--muted); font-size: 0.9em; overflow-wrap: anywhere; }
  .cat-state.bad { color: var(--bad); }
</style>
<p class="hint" data-i18n="books.intro">Books read aloud from e-book catalogs (OPDS), such as Standard Ebooks or your own library server. Add the catalogs here; the books in them can then be asked for by title or author.</p>

<section class="card">
  <h2 data-i18n="books.catalogs.title">Catalogs</h2>
  <ul class="cat-list" id="cat-list" aria-live="polite"><li data-i18n="books.loading">Reading the catalogs …</li></ul>
  <div class="row">
    <button class="secondary" id="cat-add" data-i18n="books.add">Add a catalog</button>
  </div>
  <label class="stack"><span class="hint" data-i18n="books.every">Read the catalogs again every (hours)</span>
    <input type="number" id="cat-hours" min="1" max="720" step="1"></label>
  <div class="row">
    <button id="cat-save" data-i18n="books.save">Save</button>
    <button class="secondary" id="cat-refresh" data-i18n="books.refresh">Read them now</button>
  </div>
  <div class="msg" id="msg-cat" role="status" aria-live="polite" hidden></div>
</section>

<div class="msg" id="msg" role="status" aria-live="polite" hidden></div>
<p class="hint"><span data-i18n="books.ask">Say "read me the book …" or "read my books" to hear one.</span></p>
<script>
OvosWebUI.ready(function () {
  var api = OvosWebUI.api, el = OvosWebUI.el, esc = OvosWebUI.esc, t = OvosWebUI.t, say = OvosWebUI.say;
  var timer = null;

  function field(cls, key, label, value, type, extra) {
    return '<label class="stack ' + cls + '"><span class="hint">' + esc(t(key, label)) + "</span>"
      + '<input type="' + (type || "text") + '" data-f="' + key.split(".").pop() + '" value="' + esc(value || "") + '"'
      + ' autocomplete="off" spellcheck="false"' + (extra || "") + "></label>";
  }

  function when(seconds) {
    return seconds ? new Date(seconds * 1000).toLocaleString() : "";
  }

  function state(c) {
    if (c.error) { return '<span class="cat-state bad">' + esc(t("books.state.error", "Could not be read:") + " " + c.error) + "</span>"; }
    if (!c.fetched) { return '<span class="cat-state">' + esc(t("books.state.new", "Not read yet.")) + "</span>"; }
    return '<span class="cat-state">' + esc((c.title ? c.title + " · " : "") + c.books + " " + t("books.state.books", "books")
      + " · " + t("books.state.read", "read") + " " + when(c.fetched)) + "</span>";
  }

  function row(c) {
    c = c || {};
    var pw = c.login ? ' placeholder="' + esc(t("books.f.keep", "unchanged")) + '"' : "";
    return '<li data-url="' + esc(c.url || "") + '"' + (c.login ? ' data-login="1"' : "") + ">"
      + '<div class="cat-fields">'
      + field("wide", "books.f.url", "Address", c.url, "url", ' placeholder="https://"')
      + field("", "books.f.name", "Name", c.name)
      + field("", "books.f.language", "Language (e.g. en, da; empty = any)", c.language)
      + field("", "books.f.username", "User name (if it needs a login)", c.username)
      + field("", "books.f.password", "Password", "", "password", pw)
      + "</div>"
      + (c.url ? state(c) : "")
      + '<div class="row"><button class="danger" data-act="remove">' + esc(t("books.remove", "Remove")) + "</button></div></li>";
  }

  function show(data) {
    var list = data.catalogs || [];
    el("cat-list").innerHTML = list.length ? list.map(row).join("")
      : '<li class="empty">' + esc(t("books.none", "No catalogs. Add one to have books to read.")) + "</li>";
    if (document.activeElement !== el("cat-hours")) { el("cat-hours").value = Math.round(data.refresh_hours || 24); }
    clearTimeout(timer);
    if (data.refreshing) {
      say("msg-cat", t("books.reading", "Reading the catalogs …"));
      timer = setTimeout(load, 3000);
    }
  }

  function load() {
    return api("/api/books/catalogs").then(function (d) {
      var was = !!timer; show(d);
      if (was && !d.refreshing) { el("msg-cat").hidden = true; }
    }).catch(function (e) {
      el("cat-list").innerHTML = "";
      say("msg-cat", t("books.error", "The catalogs could not be read.") + " " + e.message, true);
    });
  }

  function post(path, body) {
    return api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  }

  function collect() {
    return Array.prototype.map.call(el("cat-list").querySelectorAll("li[data-url]"), function (li) {
      var c = {};
      li.querySelectorAll("input[data-f]").forEach(function (i) { c[i.getAttribute("data-f")] = i.value.trim(); });
      // an empty password field keeps the one the catalog has
      if (!c.password && li.getAttribute("data-login") && li.getAttribute("data-url") === c.url) { delete c.password; }
      return c;
    }).filter(function (c) { return c.url; });
  }

  el("cat-add").addEventListener("click", function () {
    var empty = el("cat-list").querySelector(".empty");
    if (empty) { empty.remove(); }
    el("cat-list").insertAdjacentHTML("beforeend", row());
    el("cat-list").lastElementChild.querySelector("input").focus();
  });

  el("cat-list").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-act=remove]");
    if (btn) { btn.closest("li").remove(); say("msg-cat", t("books.unsaved", "Save to keep the change.")); }
  });

  el("cat-save").addEventListener("click", function () {
    var hours = parseFloat(el("cat-hours").value);
    post("/api/books/catalogs", {catalogs: collect(), refresh_hours: hours >= 1 ? hours : null}).then(function (d) {
      show(d);
      if (!d.refreshing) { say("msg-cat", t("books.saved", "Saved.")); }
    }).catch(function (e) { say("msg-cat", e.message, true); });
  });

  el("cat-refresh").addEventListener("click", function () {
    post("/api/books/catalogs/refresh").then(show).catch(function (e) { say("msg-cat", e.message, true); });
  });

  load();
});
</script>
